name: docs-drift

on:
  pull_request:
  push:
    branches: [main]

# Every demo README documents the manual equivalent of each scripted step, so a
# person can follow along, work in a restricted environment, or review the API
# calls without reading bash. That only stays true if something checks it.
#
# The contract: any command in a README's "Or do it step by step" section that
# invokes a project tool must exist in the demo's scripts/. Prose can be richer
# than the script, but it cannot reference commands the scripts do not run.
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check README manual steps match the scripts
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          fail = 0
          for demo in sorted(pathlib.Path("demos").glob("*/")):
              if demo.name.startswith("_"):
                  continue
              readme = demo / "README.md"
              if not readme.exists():
                  continue

              md = readme.read_text()
              m = re.search(r"##+\s*.*step by step(.*?)(?=\n##\s|\Z)", md, re.I | re.S)
              if not m:
                  print(f"::error file={readme}::no 'Or do it step by step' section")
                  fail = 1
                  continue

              scripts = "\n".join(
                  p.read_text() for p in (demo / "scripts").glob("*.sh")
              )

              # Commands the README claims the scripts run.
              for block in re.findall(r"```(?:bash|shell)\n(.*?)```", m.group(1), re.S):
                  for line in block.splitlines():
                      line = line.strip()
                      # Only check calls into this repo's own tooling.
                      hit = re.match(r"(?:\./)?(gxr|scripts/[\w-]+\.sh)\b", line)
                      if not hit:
                          continue
                      token = hit.group(1)
                      if token.startswith("scripts/") and not (demo / token).exists():
                          print(f"::error file={readme}::README references {token}, which does not exist")
                          fail = 1

              # Every SQL file the demo ships should be mentioned somewhere in
              # the README — an unreferenced one is either dead or undocumented.
              for sql in sorted((demo / "sql").glob("*.sql")):
                  if sql.name not in md:
                      print(f"::warning file={readme}::sql/{sql.name} is never mentioned in the README")

          sys.exit(fail)
          PY
